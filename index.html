<title>Dronner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
  /* Dronner — one committed visual world: volcanic dusk, ash and ember.
     Painted explicitly so the page holds on any host ground. */
  :root {
    --night:   #140f0d;
    --ground:  #1b1512;
    --bone:    #ddd5c8;
    --bone-dim:#8d8175;
    --ember:   #e0761f;
    --ember-hi:#ffb45c;
    --edge:    rgba(221, 213, 200, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--night);
    color: var(--bone);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 20px 40px;
  }

  .masthead { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }

  h1 {
    font-family: "Archivo Black", Impact, sans-serif;
    font-size: clamp(2.1rem, 7vw, 3.4rem);
    letter-spacing: 0.06em;
    margin: 0; line-height: 1;
    color: var(--bone);
    text-wrap: balance;
  }

  .kicker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--bone-dim);
  }
  .kicker span { color: var(--ember); }

  .stage {
    width: 100%; max-width: 940px;
    border: 1px solid var(--edge);
    background: var(--ground);
    position: relative; overflow: hidden;
  }

  canvas { display: block; width: 100%; height: auto; touch-action: manipulation; }

  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 26px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.76rem; color: var(--bone-dim); letter-spacing: 0.04em;
  }
  .legend b { color: var(--bone); font-weight: 600; }
  .legend .k {
    display: inline-block; border: 1px solid var(--edge); border-bottom-width: 2px;
    padding: 1px 7px; margin-right: 6px; color: var(--bone);
    background: rgba(221,213,200,0.04);
  }

  .touch { display: none; gap: 12px; width: 100%; max-width: 940px; }
  .touch button {
    flex: 1; padding: 16px;
    background: rgba(221,213,200,0.05); border: 1px solid var(--edge);
    color: var(--bone); font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
  }
  .touch button:active { background: rgba(224,118,31,0.2); border-color: var(--ember); }
  @media (hover: none) and (pointer: coarse) { .touch { display: flex; } }

  :focus-visible { outline: 2px solid var(--ember-hi); outline-offset: 3px; }

  footer {
    font-size: 0.78rem; color: var(--bone-dim);
    text-align: center; max-width: 62ch; line-height: 1.6;
  }
</style>

<div class="masthead">
  <h1>DRONNER</h1>
  <p class="kicker">Jump the stones <span>·</span> burn the husks</p>
</div>

<div class="stage">
  <canvas id="game" width="1880" height="620" aria-label="Dronner game"></canvas>
</div>

<div class="legend">
  <span><span class="k">Space</span> <b>Jump</b> the stones</span>
  <span><span class="k">↓</span> <b>Burn</b> the husks</span>
  <span><span class="k">R</span> <b>Restart</b></span>
</div>

<div class="touch">
  <button id="bStrike" type="button">Fire</button>
  <button id="bJump" type="button">Jump</button>
</div>

<footer>
  Lava stones block the path — jump them. Ash husks stand taller than the dragon can fly —
  burn them instead. Miss either and the run ends.
</footer>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const GROUND = H * 0.78;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const C = { bone: "#ddd5c8", dim: "#8d8175", ember: "#e0761f", emberHi: "#ffb45c", night: "#140f0d" };

  // ---- art ----------------------------------------------------------------
  const ART = {
    dragon: "assets/dragon.webp",
    husk:   "assets/husk.webp",
    stone:  "assets/stone.webp",
    flame:  "assets/flame.webp",
    bgFar:  "assets/bg-far.webp",
    bgMid:  "assets/bg-mid.webp"
  };
  const img = {};
  let ready = false, failed = false;

  function load() {
    return Promise.all(Object.entries(ART).map(([k, src]) => new Promise(res => {
      const i = new Image();
      i.onload = () => { img[k] = i; res(); };
      i.onerror = () => { failed = true; res(); };
      i.src = src;
    })));
  }

  // On-screen sizes. The jump peaks at 139px: it clears an 85px stone and can
  // never clear a 210px husk, so both inputs stay mandatory.
  const DRAGON_H = 190, STONE_H = 85, HUSK_H = 210, FLAME_W = 240;
  const HERO_X = W * 0.15;
  const GRAV = 0.0045, JUMP_V = -1.12;
  const REACH = 200;

  // Sprites are trimmed to their painted content, so these only carve away the
  // parts that shouldn't kill you: the dragon's trailing tail and raised wings,
  // and the husk's flung-out limbs.
  const BOX = {
    dragon: { x0: 0.46, x1: 0.95, y0: 0.30, y1: 1.0 },
    stone:  { x0: 0.05, x1: 0.95, y0: 0.08, y1: 1.0 },
    husk:   { x0: 0.26, x1: 0.80, y0: 0.02, y1: 1.0 }
  };

  const store = {
    get() {
      try {
        const v = localStorage.getItem("dronner-best") ?? localStorage.getItem("hel-runner-best");
        return parseInt(v || "0", 10) || 0;
      } catch { return 0; }
    },
    set(v) { try { localStorage.setItem("dronner-best", String(v)); } catch { /* ignore */ } }
  };

  let state, best = store.get();

  function reset() {
    state = {
      y: 0, vy: 0, onGround: true, striking: 0, run: 0,
      speed: 0.62, dist: 0, obstacles: [], embers: [],
      spawnIn: 900, over: false, started: false, t: 0
    };
  }
  reset();

  function sizeOf(kind) {
    if (kind === "stone") {
      const h = STONE_H, w = h * (img.stone.width / img.stone.height);
      return { w, h };
    }
    const h = HUSK_H, w = h * (img.husk.width / img.husk.height);
    return { w, h };
  }

  function hitbox(o) {
    const b = BOX[o.kind];
    return { x: o.x + o.w * b.x0, w: o.w * (b.x1 - b.x0),
             top: GROUND - o.h + o.h * b.y0 };
  }

  // ---- parallax: mirror-tiled so a non-seamless painting never shows a seam --
  function layer(image, offset, dh, bottom) {
    const dw = dh * (image.width / image.height);
    const span = dw * 2;
    const base = -(((offset % span) + span) % span);
    const dy = bottom - dh;
    for (let x = base; x < W + span; x += span) {
      ctx.drawImage(image, x, dy, dw, dh);
      ctx.save();
      ctx.translate(x + span, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(image, 0, 0, dw, dh);
      ctx.restore();
    }
  }

  function drawDragon(s) {
    const h = DRAGON_H, w = h * (img.dragon.width / img.dragon.height);
    const bob = s.onGround ? Math.sin(s.run * 0.55) * 4 : 0;
    const y = GROUND + s.y + bob - h;
    const tilt = s.onGround ? 0 : Math.max(-0.22, Math.min(0.22, s.vy * 0.16));

    ctx.save();
    ctx.translate(HERO_X + w / 2, y + h / 2);
    ctx.rotate(tilt);
    ctx.drawImage(img.dragon, -w / 2, -h / 2, w, h);
    ctx.restore();

    if (s.striking > 0) {
      const p = 1 - s.striking / 220;
      const grow = Math.sin(Math.min(1, p * 1.5) * Math.PI * 0.85);
      const fw = FLAME_W * grow, fh = fw * (img.flame.height / img.flame.width);
      // the source flame tapers to the right, so it is mirrored to leave the mouth
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.45 * grow;
      ctx.translate(HERO_X + w * 0.9 + fw, y + h * 0.30);
      ctx.scale(-1, 1);
      ctx.drawImage(img.flame, 0, 0, fw, fh);
      ctx.restore();
    }
  }

  function drawObstacle(o) {
    const image = o.kind === "stone" ? img.stone : img.husk;
    ctx.save();
    if (o.hit) ctx.globalAlpha = 0.22;
    ctx.drawImage(image, o.x, GROUND - o.h, o.w, o.h);
    ctx.restore();
  }

  function spawn(s) {
    const kind = Math.random() < 0.42 ? "husk" : "stone";
    const { w, h } = sizeOf(kind);
    s.obstacles.push({ kind, x: W + 60, w, h, hit: false });
    // gap measured in pixels so spacing stays fair as speed climbs
    s.spawnIn = (760 + Math.random() * 720) / s.speed;
  }

  function burst(s, x, y) {
    if (reduce) return;
    for (let i = 0; i < 18; i++) {
      s.embers.push({ x, y, vx: (Math.random() - 0.3) * 0.8,
        vy: -Math.random() * 0.55 - 0.1, life: 420 + Math.random() * 340 });
    }
  }

  function jump() {
    if (!ready) return;
    if (state.over) { reset(); return; }
    state.started = true;
    if (state.onGround) { state.vy = JUMP_V; state.onGround = false; }
  }
  function strike() {
    if (!ready) return;
    if (state.over) { reset(); return; }
    state.started = true;
    if (state.striking <= 0) state.striking = 220;
  }

  function update(dt) {
    const s = state;
    if (s.over || !s.started) return;

    s.t += dt;
    s.speed = Math.min(1.5, 0.62 + s.t / 46000);
    s.dist += dt * s.speed * 0.05;
    s.run += dt * s.speed * 0.09;

    s.vy += GRAV * dt;
    s.y += s.vy * dt;
    if (s.y >= 0) { s.y = 0; s.vy = 0; s.onGround = true; }
    if (s.striking > 0) s.striking -= dt;

    s.spawnIn -= dt;
    if (s.spawnIn <= 0) spawn(s);

    const dw = DRAGON_H * (img.dragon.width / img.dragon.height);
    const db = BOX.dragon;
    const bx = HERO_X + dw * db.x0, bw = dw * (db.x1 - db.x0);
    const dragonTop = GROUND + s.y - DRAGON_H + DRAGON_H * db.y0;

    for (const o of s.obstacles) {
      o.x -= dt * s.speed;
      if (o.hit) continue;
      const hb = hitbox(o);

      // the breath box only burns husks; it never widens what can kill you
      if (o.kind === "husk" && s.striking > 0 &&
          hb.x < bx + bw + REACH && hb.x + hb.w > bx) {
        o.hit = true;
        burst(s, hb.x + hb.w / 2, hb.top + o.h * 0.35);
        continue;
      }

      if (hb.x < bx + bw && hb.x + hb.w > bx && hb.top < GROUND + s.y) {
        s.over = true;
        const score = Math.floor(s.dist);
        if (score > best) { best = score; store.set(best); }
      }
    }
    s.obstacles = s.obstacles.filter(o => o.x > -400);

    for (const e of s.embers) {
      e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 0.0009 * dt; e.life -= dt;
    }
    s.embers = s.embers.filter(e => e.life > 0);
  }

  function render() {
    const s = state;

    ctx.fillStyle = C.night;
    ctx.fillRect(0, 0, W, H);

    if (!ready) {
      ctx.fillStyle = C.dim;
      ctx.font = '400 26px "IBM Plex Mono", monospace';
      ctx.textAlign = "center";
      ctx.fillText(failed ? "art failed to load" : "loading…", W / 2, H / 2);
      ctx.textAlign = "left";
      return;
    }

    // Scaled past canvas width so at most one mirror axis is ever on screen —
    // the painting has a bright sun, and a visible mirror would give it away.
    layer(img.bgFar, s.dist * 1.1, H * 1.45, GROUND + H * 0.34);
    ctx.save();
    ctx.globalAlpha = 0.5;   // the ruins' smoke reads near-white at full strength
    layer(img.bgMid, s.dist * 7.0, H * 0.62, GROUND + 26);
    ctx.restore();

    // scrim: pushes the painting behind the gameplay so obstacles read instantly
    const scrim = ctx.createLinearGradient(0, 0, 0, GROUND);
    scrim.addColorStop(0, "rgba(20,15,13,0.62)");
    scrim.addColorStop(0.72, "rgba(20,15,13,0.42)");
    scrim.addColorStop(1, "rgba(20,15,13,0.58)");
    ctx.fillStyle = scrim;
    ctx.fillRect(0, 0, W, GROUND);

    // ground
    ctx.fillStyle = "#150f0c";
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = "rgba(224,118,31,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

    ctx.strokeStyle = "rgba(224,118,31,0.22)"; ctx.lineWidth = 3;
    for (let i = 0; i < 26; i++) {
      const x = ((i * 96 - s.dist * 19) % (W + 96) + W + 96) % (W + 96) - 48;
      ctx.beginPath(); ctx.moveTo(x, GROUND + 30); ctx.lineTo(x + 38, GROUND + 30); ctx.stroke();
    }

    for (const o of s.obstacles) drawObstacle(o);
    drawDragon(s);

    for (const e of s.embers) {
      ctx.globalAlpha = Math.max(0, e.life / 760);
      ctx.fillStyle = C.emberHi;
      ctx.fillRect(e.x, e.y, 6, 6);
    }
    ctx.globalAlpha = 1;

    ctx.font = '600 34px "IBM Plex Mono", monospace';
    ctx.textAlign = "right"; ctx.fillStyle = C.bone;
    ctx.fillText(String(Math.floor(s.dist)).padStart(5, "0"), W - 34, 60);
    ctx.font = '400 20px "IBM Plex Mono", monospace';
    ctx.fillStyle = C.dim;
    ctx.fillText("BEST " + String(best).padStart(5, "0"), W - 34, 92);

    if (!s.started || s.over) {
      ctx.fillStyle = "rgba(20,15,13,0.74)"; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = C.bone;
      ctx.font = '56px "Archivo Black", Impact, sans-serif';
      ctx.fillText(s.over ? "THE RUN ENDS" : "DRONNER", W / 2, H / 2 - 14);
      ctx.font = '400 24px "IBM Plex Mono", monospace';
      ctx.fillStyle = C.ember;
      ctx.fillText(s.over ? "Space to run again" : "Space to begin", W / 2, H / 2 + 34);
    }
    ctx.textAlign = "left";
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(48, now - last); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  // one loop, started immediately so "loading…" is visible while art arrives
  requestAnimationFrame(loop);
  Promise.all([load(), document.fonts.ready]).then(() => { ready = !failed; });

  addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); jump(); }
    else if (e.code === "ArrowDown" || e.code === "KeyS" || e.code === "KeyX") { e.preventDefault(); strike(); }
    else if (e.code === "KeyR") reset();
  });
  cv.addEventListener("pointerdown", jump);
  document.getElementById("bJump").addEventListener("click", jump);
  document.getElementById("bStrike").addEventListener("click", strike);
})();
</script>
